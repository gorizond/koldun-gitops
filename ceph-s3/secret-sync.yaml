apiVersion: v1
kind: ServiceAccount
metadata:
  name: s3-secret-sync
  namespace: rook-ceph
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: s3-secret-sync
  namespace: rook-ceph
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: s3-secret-sync
  namespace: rook-ceph
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: s3-secret-sync
subjects:
  - kind: ServiceAccount
    name: s3-secret-sync
    namespace: rook-ceph
---
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-secret-sync
  namespace: rook-ceph
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    spec:
      serviceAccountName: s3-secret-sync
      restartPolicy: Never
      containers:
        - name: sync
          image: alpine/k8s:1.31.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until kubectl -n rook-ceph get secret koldun-s3 >/dev/null 2>&1; do
                echo "waiting for the object bucket claim secret"
                sleep 5
              done
              AK=$(kubectl -n rook-ceph get secret koldun-s3 -o go-template='{{.data.AWS_ACCESS_KEY_ID | base64decode}}')
              SK=$(kubectl -n rook-ceph get secret koldun-s3 -o go-template='{{.data.AWS_SECRET_ACCESS_KEY | base64decode}}')
              kubectl -n rook-ceph create secret generic csi-s3-secret \
                --from-literal=accessKeyID="$AK" \
                --from-literal=secretAccessKey="$SK" \
                --from-literal=endpoint="http://rook-ceph-rgw-koldun-s3.rook-ceph.svc:80" \
                --dry-run=client -o yaml | kubectl apply -f -
