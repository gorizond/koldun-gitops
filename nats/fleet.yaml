defaultNamespace: nats

labels:
  koldun.io/component: nats

helm:
  repo: https://nats-io.github.io/k8s/helm/charts/
  chart: nats
  version: 1.2.8
  releaseName: nats
  values:
    natsBox:
      enabled: false
    config:
      jetstream:
        enabled: true
        fileStore:
          pvc:
            size: 10Gi
      cluster:
        enabled: false
    container:
      merge:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
