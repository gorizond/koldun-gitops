---
name: lint

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pinned Helm versions
        run: |
          bash scripts/check-pinned-versions.sh
          bash scripts/test-check-pinned-versions.sh

      - name: helm lint
        run: |
          if ! command -v helm >/dev/null 2>&1; then
            echo "helm is not installed on the runner." >&2
            exit 1
          fi
          found=0
          for chart in */Chart.yaml; do
            [ -e "$chart" ] || continue
            found=1
            helm lint "$(dirname "$chart")"
          done
          if [ "$found" -eq 0 ]; then
            echo "no local charts"
          fi

      - name: yamllint
        run: |
          python3 -m pip install --quiet yamllint
          yamllint -c .yamllint.yaml .

      - name: english only
        run: |
          if grep -rInP '[\x{0400}-\x{04FF}]' \
            --include='*.md' --include='*.yaml' --include='*.yml' \
            --include='*.sh' --include='*.json' \
            --exclude-dir=.git . ; then
            echo "Non-English (Cyrillic) text found in repository files." >&2
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

      - name: default passwords
        run: |
          if grep -rInE '(passw0rd|changeme)' \
            --include='*.yaml' --include='*.yml' \
            --exclude-dir=.git --exclude-dir=.github . ; then
            echo "Default password pattern found." >&2
            exit 1
          fi
